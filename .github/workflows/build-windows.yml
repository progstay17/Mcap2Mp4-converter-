name: build-windows
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: choco install nsis -y --no-progress
      - run: pyinstaller build/mcap2mp4.spec --noconfirm
      - run: dist\MCAP2MP4\mcap2mp4-cli.exe --version
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" "-DVERSION=0.3.2" "-DOUTFILE=dist\installer\MCAP2MP4-Setup-0.3.2.exe" "build\installer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/installer/MCAP2MP4-Setup-0.3.2.exe")) { throw "Installer output was not created." }
      - uses: actions/upload-artifact@v4
        with: { name: MCAP2MP4-Setup-0.3.2, path: dist/installer/*.exe }
